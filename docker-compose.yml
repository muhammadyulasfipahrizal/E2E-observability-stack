services:
  # Otel Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/otel-collector.yml"
    volumes:
      - ./otel/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # Prometheus metrics exporter
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - research-observability

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - research-observability


  # Loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - research-observability


  # Jaeger
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    command:
      - "--config=/etc/jaeger/config.yml"
    volumes:
      - ./jaeger/config.yml:/etc/jaeger/config.yml:ro
      - jaeger-data:/data
    ports:
      - "16686:16686" # Jaeger UI
      - "4317" # OTLP gRPC internal
    networks:
      - research-observability

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - research-observability

  api:
    build: ./app
    container_name: observability-api
    ports:
      - "8081:8080"
    networks:
      - research-observability

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  jaeger-data:

networks:
  research-observability:
    external: true