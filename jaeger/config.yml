extensions:
  jaeger_query:
    storage:
      traces: memory
    ui:
      log_access: true
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      memory:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory

service:
  extensions:
    - jaeger_query
    - jaeger_storage

  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - jaeger_storage_exporter